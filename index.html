<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Kimberly 🥺💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fbcfe8 0%, #f43f5e 100%);
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15), inset 0 0 25px rgba(255, 255, 255, 0.6);
            position: relative;
            overflow: hidden;
            border-radius: 2rem;
        }

        .liquid-glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, transparent 70%);
            transform: rotate(30deg);
            pointer-events: none;
            animation: liquidFlow 8s ease-in-out infinite alternate;
        }

        @keyframes liquidFlow {
            0% { transform: translate(-20px, -20px) rotate(0deg); }
            100% { transform: translate(20px, 20px) rotate(10deg); }
        }

        .particle {
            position: absolute;
            top: -10%;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% {
                opacity: 0.85;
            }
            85% {
                opacity: 0.85;
            }
            100% {
                transform: translateY(420px) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        .heart-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body class="p-4">

    <main id="card" class="liquid-glass p-8 md:p-10 max-w-md w-full text-center relative z-10 transition-all duration-500">
        
        <!-- Cascada interna de elementos dentro del Liquid Glass -->
        <div id="rain-container" class="absolute inset-0 pointer-events-none overflow-hidden z-1"></div>

        <div class="mb-6 relative z-10">
            <div class="w-20 h-20 bg-white/40 backdrop-blur-md rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner heart-float border border-white/50">
                <span class="text-4xl">🥺</span>
            </div>
            <h1 class="text-2xl md:text-3xl font-bold text-rose-900 drop-shadow-sm mb-4">Para Kimberly ❤️</h1>
            
            <div class="bg-white/30 backdrop-blur-sm p-4 rounded-2xl border border-white/40 mb-6 text-gray-800 font-medium italic text-sm md:text-base leading-relaxed shadow-sm">
                "Sé que te causé dolor,<br>
                y hoy te pido mi perdón.<br>
                Si me das otra oportunidad,<br>
                te daré mi corazón."
            </div>
        </div>

        <div class="relative z-10 flex items-center justify-center gap-6 mt-4 h-16">
            <button id="btn-si" onclick="aceptarPerdon()" class="bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white font-bold px-8 py-3 rounded-full shadow-lg hover:shadow-xl transform hover:scale-105 transition duration-200 text-base cursor-pointer">
                SÍ 🥰
            </button>

            <button id="btn-no" class="bg-gradient-to-r from-rose-500 to-red-600 text-white font-bold px-8 py-3 rounded-full shadow-lg text-base cursor-pointer select-none transition-all duration-100">
                NO 😢
            </button>
        </div>
    </main>

    <script>
        // Lluvia dinámica de rosas, flores y corazones rosados dentro del contenedor Liquid Glass
        const rainContainer = document.getElementById('rain-container');
        const symbols = ['🌹', '🌸', '💖', '🌷', '💗', '🌺'];
        const particleCount = 18;

        for (let i = 0; i < particleCount; i++) {
            const span = document.createElement('span');
            span.className = 'particle';
            span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            
            // Posición y propiedades aleatorias contenidas en la tarjeta
            span.style.left = Math.random() * 90 + '%';
            span.style.fontSize = (Math.random() * 0.8 + 0.9) + 'rem';
            span.style.animationDuration = (Math.random() * 4 + 3) + 's';
            span.style.animationDelay = (Math.random() * 5) + 's';
            
            rainContainer.appendChild(span);
        }

        const btnNo = document.getElementById('btn-no');
        const card = document.getElementById('card');

        // Función para mover el botón NO de forma evasiva por toda la pantalla
        function moverBotonNo() {
            const padding = 40;
            const maxX = window.innerWidth - btnNo.offsetWidth - padding;
            const maxY = window.innerHeight - btnNo.offsetHeight - padding;
            const minX = padding;
            const minY = padding;

            const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
            const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
            btnNo.style.zIndex = '9999';
        }

        // Eventos para asegurar que el botón NO nunca pueda ser presionado
        btnNo.addEventListener('mouseover', moverBotonNo);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moverBotonNo();
        });
        btnNo.addEventListener('click', (e) => {
            e.preventDefault();
            moverBotonNo();
        });

        // Función cuando Kimberly acepta
        function aceptarPerdon() {
            card.innerHTML = `
                <div class="py-6 relative z-10">
                    <div class="w-24 h-24 bg-white/50 backdrop-blur-md rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner animate-bounce border border-white/60">
                        <span class="text-5xl">🎉</span>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-bold text-emerald-800 drop-shadow-sm mb-3">¡Gracias, Kimberly!</h1>
                    <p class="text-gray-800 font-medium text-base mb-6 leading-relaxed">
                        Me alegra tanto tu respuesta. Te prometo portarme bien y cuidarte muchísimo siempre. ✨💖
                    </p>
                    <div class="text-3xl space-x-2">
                        🥰 🌸 💌
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
